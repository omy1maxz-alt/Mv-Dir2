name: Video enhancer worker checks

on:
  pull_request:
    paths:
      - "services/video-enhancer-worker/**"
      - ".github/workflows/video-enhancer-worker.yml"
  push:
    branches: ["main"]
    paths:
      - "services/video-enhancer-worker/**"
      - ".github/workflows/video-enhancer-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  worker-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/video-enhancer-worker
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install worker dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx
      - name: Run worker API tests
        run: pytest -q
