<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181824"/>
      <stop offset="100%" stop-color="#08080c"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#d946ef"/>
    </linearGradient>
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a2a38"/>
      <stop offset="100%" stop-color="#14141e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Rounded Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="url(#accentGrad)" stroke-width="6" opacity="0.6"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="256" r="160" fill="url(#accentGrad)" opacity="0.18" filter="url(#glow)"/>

  <!-- Clapperboard Top Stick (Angled) -->
  <g transform="translate(100, 130) rotate(-14 40 40)">
    <rect x="0" y="0" width="310" height="54" rx="12" fill="url(#accentGrad)"/>
    <!-- Stripes -->
    <path d="M50 0 L80 54 L115 54 L85 0 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M145 0 L175 54 L210 54 L180 0 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M240 0 L270 54 L305 54 L275 0 Z" fill="#ffffff" opacity="0.95"/>
  </g>

  <!-- Clapperboard Body -->
  <rect x="100" y="195" width="312" height="210" rx="20" fill="url(#slateGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="4"/>

  <!-- Play Symbol / Director Star in center of Board -->
  <polygon points="230,265 310,310 230,355" fill="url(#accentGrad)"/>

  <!-- Soundwave / Timeline Lines at bottom of Board -->
  <rect x="135" y="375" width="24" height="10" rx="4" fill="#6366f1" opacity="0.8"/>
  <rect x="167" y="370" width="24" height="15" rx="4" fill="#8b5cf6" opacity="0.9"/>
  <rect x="199" y="365" width="24" height="20" rx="4" fill="#a855f7"/>
  <rect x="231" y="360" width="24" height="25" rx="4" fill="#d946ef"/>
  <rect x="263" y="362" width="24" height="23" rx="4" fill="#d946ef"/>
  <rect x="295" y="367" width="24" height="18" rx="4" fill="#a855f7"/>
  <rect x="327" y="372" width="24" height="13" rx="4" fill="#8b5cf6" opacity="0.9"/>
  <rect x="359" y="377" width="24" height="8" rx="4" fill="#6366f1" opacity="0.8"/>
</svg>
